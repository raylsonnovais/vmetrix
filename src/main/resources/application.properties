# Embedded H2 in Oracle compatibility mode. The Query Manager targets Oracle SQL dialect
# (FETCH FIRST ... ROWS ONLY, VARCHAR2/NUMBER types), so we run H2 in MODE=Oracle to keep
# the generated SQL faithful to the production target without needing a real Oracle instance.
spring.datasource.url=jdbc:h2:mem:vmetrix;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create the model tables, the metadata tables and load the seed on startup.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# H2 web console at http://localhost:8080/h2-console (JDBC URL above, user sa, empty password).
# Handy for inspecting the seed and running the generated SQL by hand during the demo.
spring.h2.console.enabled=true

# Fail fast and loud if the metadata/model scripts do not apply cleanly.
spring.sql.init.continue-on-error=false
